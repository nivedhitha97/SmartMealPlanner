# Builds the iOS app with Xcode on every push and pull request to develop.
# This is an Xcode project (no Package.swift), so it uses xcodebuild rather than `swift build`.

name: iOS build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    # The app targets iOS 26, so it needs a runner image that ships Xcode 26.
    runs-on: macos-26

    steps:
    - uses: actions/checkout@v5

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build for iOS Simulator
      run: |
        xcodebuild build \
          -project SmartMealPlanner.xcodeproj \
          -target SmartMealPlanner \
          -configuration Debug \
          -sdk iphonesimulator \
          CODE_SIGNING_ALLOWED=NO
